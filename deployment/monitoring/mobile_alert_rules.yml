# Prometheus alert rules for Mobile PlantGuard

groups:
  - name: mobile_plantguard_alerts
    rules:
      # Application availability alerts
      - alert: MobilePlantGuardDown
        expr: up{job="plantguard-mobile"} == 0
        for: 1m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "Mobile PlantGuard application is down"
          description: "Mobile PlantGuard application has been down for more than 1 minute"

      # High error rate alerts
      - alert: HighErrorRate
        expr: rate(mobile_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          component: application
        annotations:
          summary: "High error rate detected in Mobile PlantGuard"
          description: "Error rate is {{ $value }} errors per second over the last 5 minutes"

      # Performance alerts
      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, rate(mobile_request_duration_seconds_bucket[5m])) > 5
        for: 3m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "Slow response times in Mobile PlantGuard"
          description: "95th percentile response time is {{ $value }}s over the last 5 minutes"

      # Memory usage alerts
      - alert: HighMemoryUsage
        expr: (container_memory_usage_bytes{container_label_com_docker_compose_service="plantguard-mobile"} / container_spec_memory_limit_bytes) > 0.8
        for: 5m
        labels:
          severity: warning
          component: resources
        annotations:
          summary: "High memory usage in Mobile PlantGuard"
          description: "Memory usage is {{ $value | humanizePercentage }} of the limit"

      # CPU usage alerts
      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{container_label_com_docker_compose_service="plantguard-mobile"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          component: resources
        annotations:
          summary: "High CPU usage in Mobile PlantGuard"
          description: "CPU usage is {{ $value | humanizePercentage }} over the last 5 minutes"

      # Disk space alerts
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Low disk space on Mobile PlantGuard server"
          description: "Disk space is {{ $value | humanizePercentage }} full"

  - name: mobile_component_alerts
    rules:
      # Component-specific alerts
      - alert: CameraComponentFailure
        expr: rate(mobile_component_errors_total{component="camera"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          component: camera
        annotations:
          summary: "High failure rate in camera component"
          description: "Camera component error rate is {{ $value }} errors per second"

      - alert: UploadComponentFailure
        expr: rate(mobile_component_errors_total{component="upload"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          component: upload
        annotations:
          summary: "High failure rate in upload component"
          description: "Upload component error rate is {{ $value }} errors per second"

      - alert: VoiceComponentFailure
        expr: rate(mobile_component_errors_total{component="voice"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          component: voice
        annotations:
          summary: "High failure rate in voice component"
          description: "Voice component error rate is {{ $value }} errors per second"

      - alert: AnalysisComponentFailure
        expr: rate(mobile_component_errors_total{component="analysis"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          component: analysis
        annotations:
          summary: "High failure rate in analysis component"
          description: "Analysis component error rate is {{ $value }} errors per second"

  - name: mobile_user_experience_alerts
    rules:
      # User experience alerts
      - alert: LowSuccessRate
        expr: (rate(mobile_interactions_success_total[10m]) / rate(mobile_interactions_total[10m])) < 0.9
        for: 5m
        labels:
          severity: warning
          component: user_experience
        annotations:
          summary: "Low success rate for user interactions"
          description: "Success rate is {{ $value | humanizePercentage }} over the last 10 minutes"

      - alert: HighSessionDropRate
        expr: rate(mobile_sessions_dropped_total[10m]) > 0.1
        for: 3m
        labels:
          severity: warning
          component: user_experience
        annotations:
          summary: "High session drop rate"
          description: "Session drop rate is {{ $value }} sessions per second"

      - alert: SlowModelInference
        expr: histogram_quantile(0.95, rate(mobile_model_inference_duration_seconds_bucket[5m])) > 10
        for: 3m
        labels:
          severity: warning
          component: ml_models
        annotations:
          summary: "Slow ML model inference times"
          description: "95th percentile inference time is {{ $value }}s"

  - name: mobile_infrastructure_alerts
    rules:
      # Infrastructure alerts
      - alert: NginxDown
        expr: up{job="nginx-mobile"} == 0
        for: 1m
        labels:
          severity: critical
          component: nginx
        annotations:
          summary: "Nginx reverse proxy is down"
          description: "Nginx has been down for more than 1 minute"

      - alert: RedisDown
        expr: up{job="redis-mobile"} == 0
        for: 1m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis cache is down"
          description: "Redis has been down for more than 1 minute"

      - alert: HighNginxErrorRate
        expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          component: nginx
        annotations:
          summary: "High error rate in Nginx"
          description: "Nginx 5xx error rate is {{ $value }} errors per second"

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage is {{ $value | humanizePercentage }}"

  - name: mobile_security_alerts
    rules:
      # Security-related alerts
      - alert: UnusualTrafficPattern
        expr: rate(nginx_http_requests_total[1m]) > 100
        for: 2m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Unusual traffic pattern detected"
          description: "Request rate is {{ $value }} requests per second"

      - alert: HighFailedAuthAttempts
        expr: rate(mobile_auth_failures_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "High number of failed authentication attempts"
          description: "Failed auth rate is {{ $value }} attempts per second"

      - alert: SuspiciousUserAgent
        expr: increase(nginx_http_requests_total{user_agent=~".*bot.*|.*crawler.*|.*scanner.*"}[5m]) > 50
        for: 1m
        labels:
          severity: info
          component: security
        annotations:
          summary: "Suspicious user agent activity detected"
          description: "{{ $value }} requests from suspicious user agents in the last 5 minutes"
