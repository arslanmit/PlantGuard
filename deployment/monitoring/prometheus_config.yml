# Prometheus configuration for Mobile PlantGuard monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "plantguard-mobile"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "mobile_alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Mobile PlantGuard application metrics
  - job_name: "plantguard-mobile"
    static_configs:
      - targets: ["plantguard-mobile:8501"]
    metrics_path: "/metrics"
    scrape_interval: 30s
    scrape_timeout: 10s

    # Mobile-specific metric relabeling
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "mobile_.*"
        target_label: "component"
        replacement: "mobile"

      - source_labels: [__name__]
        regex: "streamlit_.*"
        target_label: "component"
        replacement: "streamlit"

  # Nginx metrics (if nginx-prometheus-exporter is enabled)
  - job_name: "nginx-mobile"
    static_configs:
      - targets: ["nginx-mobile:9113"]
    scrape_interval: 30s

  # Redis metrics (if redis_exporter is enabled)
  - job_name: "redis-mobile"
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 30s

  # Node exporter for system metrics
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 30s

  # cAdvisor for container metrics
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    scrape_interval: 30s

    # Filter out unnecessary container metrics
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        regex: "plantguard-mobile|nginx-mobile|redis-cache"
        target_label: "service"
        replacement: "${1}"

      - source_labels: [container_label_com_docker_compose_service]
        regex: ""
        action: drop

  # Custom mobile metrics endpoint
  - job_name: "mobile-custom-metrics"
    static_configs:
      - targets: ["plantguard-mobile:8501"]
    metrics_path: "/mobile-metrics"
    scrape_interval: 60s

    # Custom mobile metric processing
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "mobile_component_.*"
        target_label: "metric_type"
        replacement: "component"

      - source_labels: [__name__]
        regex: "mobile_performance_.*"
        target_label: "metric_type"
        replacement: "performance"

      - source_labels: [__name__]
        regex: "mobile_usage_.*"
        target_label: "metric_type"
        replacement: "usage"
# Remote write configuration (optional, for long-term storage)
