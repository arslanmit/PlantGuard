# Docker Compose configuration for Mobile PlantGuard

version: '3.8'

services:
  # Main mobile application
  plantguard-mobile:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.mobile
      target: production
    container_name: plantguard-mobile
    restart: unless-stopped
    
    # Port mapping
    ports:
      - "8501:8501"
    
    # Environment variables
    environment:
      - PYTHONPATH=/app/src
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=true
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=200
      - STREAMLIT_SERVER_MAX_MESSAGE_SIZE=200
      - LOG_LEVEL=INFO
    
    # Volume mounts
    volumes:
      - ../data/models:/app/data/models:ro
      - ../logs:/app/logs
      - mobile_temp:/app/temp
      - mobile_cache:/app/cache
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Network
    networks:
      - plantguard-network

  # Nginx reverse proxy for mobile optimization
  nginx-mobile:
    image: nginx:alpine
    container_name: plantguard-nginx-mobile
    restart: unless-stopped
    
    # Port mapping
    ports:
      - "80:80"
      - "443:443"
    
    # Volume mounts
    volumes:
      - ./nginx/mobile.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../assets:/var/www/assets:ro
      - nginx_cache:/var/cache/nginx
    
    # Dependencies
    depends_on:
      - plantguard-mobile
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
        reservations:
          memory: 128M
          cpus: '0.1'
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    
    # Network
    networks:
      - plantguard-network

  # Redis for caching (optional)
  redis-cache:
    image: redis:alpine
    container_name: plantguard-redis-mobile
    restart: unless-stopped
    
    # Command with mobile-optimized configuration
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    
    # Volume mounts
    volumes:
      - redis_data:/data
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.1'
        reservations:
          memory: 128M
          cpus: '0.05'
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    
    # Network
    networks:
      - plantguard-network

# Development override
  plantguard-mobile-dev:
    extends:
      service: plantguard-mobile
    build:
      target: development
    container_name: plantguard-mobile-dev
    
    # Development-specific volumes
    volumes:
      - ../src:/app/src
      - ../data:/app/data
      - ../logs:/app/logs
      - ../tests:/app/tests
      - mobile_temp:/app/temp
      - mobile_cache:/app/cache
    
    # Development environment
    environment:
      - PYTHONPATH=/app/src
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=true
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=200
      - STREAMLIT_SERVER_MAX_MESSAGE_SIZE=200
      - STREAMLIT_SERVER_RUN_ON_SAVE=true
      - LOG_LEVEL=DEBUG
    
    # Override command for development
    command: >
      streamlit run mobile_plantguard_app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false
      --server.enableCORS=false
      --server.enableXsrfProtection=true
      --server.runOnSave=true
    
    profiles:
      - development

# Networks
networks:
  plantguard-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes
volumes:
  mobile_temp:
    driver: local
  mobile_cache:
    driver: local
  nginx_cache:
    driver: local
  redis_data:
    driver: local