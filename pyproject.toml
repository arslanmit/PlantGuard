# 📦 Import Organization - Keep imports clean and organized
[tool.ruff.lint.isort]
# 🏠 Our code (PlantGuard modules)
known-first-party = ["plantguard", "src"]

# 🌐 External libraries we use (organized by category)
known-third-party = [
  # 🧠 AI/ML Core
  "torch",
  "torchvision",
  "torchaudio",
  "torchmetrics",

  # 📊 Data Science
  "numpy",
  "pandas",
  "sklearn",

  # 👁️ Computer Vision
  "cv2",
  "PIL",

  # 🤗 Hugging Face
  "transformers",
  "datasets",
  "accelerate",
  "huggingface_hub",
  "tokenizers",
  "safetensors",

  # 🎵 Audio
  "librosa",
  "soundfile",
  "speech_recognition",
  "whisper",

  # 🌐 Web Interface
  "streamlit",
  "streamlit_webrtc",
  "streamlit_option_menu",

  # 📈 Visualization
  "matplotlib",
  "seaborn",
  "plotly",

  # 🧪 Testing & ML Tools
  "pytest",
  "wandb",
  "optuna",
]

split-on-trailing-comma = true # Split long import lists nicely
force-single-line = false      # Allow multiple imports per line when short

# 📝 Quote Style - Consistent string quotes
[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"    # Use "double quotes" for strings
multiline-quotes = "double" # Use """double quotes""" for multi-line
docstring-quotes = "double" # Use """double quotes""" for docstrings

# 🔒 Security Settings
[tool.ruff.lint.flake8-bandit]
check-typed-exception = true # Check exception handling

# 📁 Per-file ignores - Different rules for different file types
[tool.ruff.lint.per-file-ignores]
# 🧪 Test files - Ignore ALL common linter rules that typically apply to tests
"tests/**/*.py" = [
  "S101",   # Allow assert statements in tests
  "S102",   # Allow use of exec detected
  "S110",   # Allow try-except-pass detected
  "T201",   # Allow print statements in tests for debugging
  "E402",   # Allow module-level imports after sys.path manipulation in tests
  "PTH108", # Allow os.unlink() instead of Path.unlink()
  "SIM117", # Allow nested with statements instead of single with
  "PT017",  # Allow assertion on exception in except block
  "UP038",  # Allow isinstance calls with tuples
  "PT015",  # Allow assertion always fails patterns
  "B011",   # Allow assert False calls
  "F841",   # Allow unused local variables
  "B007",   # Allow unused loop variables
  "SIM102", # Allow nested if statements
  "C408",   # Allow unnecessary dict calls
  "RUF012", # Allow mutable class attributes
  "E501",   # Allow long lines
  "COM812", # Allow missing trailing commas
]

# 📓 Scripts and notebooks - Allow subprocess calls and missing docstrings
"scripts/**/*.py" = [
  "S603", # Allow subprocess calls in scripts
  "S607", # Allow partial executable paths in scripts
  "T201", # Allow print statements in scripts for output
  "E402", # Allow module-level imports after sys.path manipulation in scripts
]

# Files that intentionally manipulate sys.path at module import time (pages/app)
"pages/**/*.py" = [
  "E402", # Allow module-level imports after sys.path manipulation in page modules
]


# 🎨 Code Formatting - How code looks
[tool.ruff.format]
quote-style = "double" # Use "double quotes"
indent-style = "space" # Use spaces, not tabs
line-ending = "auto"   # Auto-detect line endings (Windows/Mac/Linux)

# 📦 Hatchling - Modern Python packaging tool
[tool.hatch.build.targets.wheel]
packages = ["src/plantguard"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/config", "/requirements.txt", "/README.md", "/LICENSE"]
exclude = [
  "/.git",
  "/.venv",
  "/build",
  "/dist",
  "/__pycache__",
  "/.pytest_cache",
  "/.mypy_cache",
  "/.ruff_cache",
  "/logs",
  "/runs",
  "/data",
  "/notebooks",
  "/htmlcov",
  "/tests/",
]

