# ============================================================================
# 🌿 PlantGuard - AI Plant Disease Detection System
# ============================================================================
# This file configures the entire PlantGuard project
#
# 🚀 QUICK START:
#   make setup    - Install everything
#   make run      - Launch the app
#   make dev      - Development workflow
#   make help     - See all commands
#
# 📝 SECTIONS:
#   1. Build System    - How Python packages the project
#   2. Project Info    - Name, version, description
#   3. Dependencies    - What libraries we need
#   4. Code Quality    - Formatting and linting rules
#   5. Testing         - How tests are run
#   6. Type Checking   - Static type analysis
# ============================================================================

# ============================================================================
# 1️⃣ BUILD SYSTEM - How Python packages this project
# ============================================================================
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================================
# 2️⃣ PROJECT INFORMATION - Basic project details
# ============================================================================
[project]
name = "plantguard"
version = "0.1.0"
description = "🌿 AI-powered plant disease detection with Vision Transformer, MobileNet, and ResNet50 models"
authors = [{ name = "PlantGuard Team", email = "umit.arslan@outlook.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"

# 🏷️ Keywords for package discovery
keywords = [
  "plant-disease", "computer-vision", "machine-learning",
  "agriculture", "ai", "pytorch", "streamlit", "multimodal"
]

# 📋 Package classifiers (for PyPI)
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: OS Independent",
  "Environment :: Web Environment",
]

# ============================================================================
# 3️⃣ DEPENDENCIES - What libraries PlantGuard needs to work
# ============================================================================
# 💡 TIP: All versions are in requirements.txt - this is just the minimum needed

dependencies = [
  # 🧠 AI/ML Core - The brain of PlantGuard
  "torch>=2.1.0",           # PyTorch - main ML framework
  "torchvision>=0.16.0",    # Computer vision models
  "torchaudio>=2.1.0",      # Audio processing
  "torchmetrics>=1.2.0",    # ML metrics and evaluation

  # 📊 Data Processing - Handle numbers and data
  "numpy>=1.24.0",          # Fast arrays and math
  "pandas>=2.1.0",          # Data tables and analysis
  "scikit-learn>=1.3.0",    # Traditional ML algorithms

  # 👁️ Computer Vision - See and understand images
  "opencv-python-headless>=4.8.0",  # Image processing (no GUI)
  "Pillow>=10.0.0",                  # Image loading and basic editing

  # 🤗 Hugging Face - Pre-trained AI models
  "transformers>=4.34.0",   # Vision Transformer, BERT, etc.
  "accelerate>=0.24.0",     # Fast model loading
  "datasets>=2.14.0",       # Dataset handling

  # 🎵 Audio Processing - Hear and understand speech
  "librosa>=0.10.1",        # Audio analysis
  "soundfile>=0.12.1",      # Audio file reading/writing
  "SpeechRecognition>=3.10.0",  # Speech-to-text

  # 🌐 Web Interface - The app you see in your browser
  "streamlit>=1.27.0",      # Main web framework
  "streamlit-webrtc>=0.47.0",  # Real-time audio/video
  "pycloudflared>=0.2.0",   # HTTPS tunnels for microphone
  "pyngrok>=7.0.0",         # Alternative tunneling

  # 🛠️ Utilities - Helper tools
  "python-dotenv>=1.0.0",   # Environment variables (.env files)
  "tensorboard>=2.14.0",    # Training visualization
]

# ============================================================================
# 📦 OPTIONAL DEPENDENCIES - Extra features you can install
# ============================================================================
# 💡 USAGE:
#   pip install plantguard[dev]      - Development tools
#   pip install plantguard[jupyter]  - Notebook support
#   pip install plantguard[all]      - Everything
#
# 🚀 QUICK INSTALL: make setup (installs everything automatically)

[project.optional-dependencies]

# 🛠️ Development Tools - For coding and maintaining PlantGuard
dev = [
  "ruff>=0.1.0",           # ⚡ Super fast Python linter & formatter
  "mypy>=1.6.0",           # 🔍 Type checking (catches bugs early)
  "pytest>=7.4.0",        # 🧪 Testing framework
  "pytest-cov>=4.1.0",    # 📊 Test coverage reports
  "pytest-mock>=3.12.0",  # 🎭 Mock objects for testing
  "bandit>=1.7.5",        # 🔒 Security vulnerability scanner
  "safety>=3.0.0",        # 🛡️ Check for known security issues
  "pre-commit>=3.0.0",    # 🪝 Git hooks for code quality
]

# 📚 Documentation Tools - Generate beautiful docs
docs = [
  "sphinx>=7.0.0",         # 📖 Documentation generator
  "sphinx-rtd-theme>=2.0.0",  # 🎨 Read the Docs theme
  "myst-parser>=2.0.0",    # 📝 Markdown support in Sphinx
]

# 📓 Jupyter & Analysis - Interactive development
jupyter = [
  "jupyter>=1.0.0",        # 📓 Jupyter notebooks
  "ipykernel>=6.25.0",     # 🐍 Python kernel for notebooks
  "matplotlib>=3.7.0",     # 📈 Plotting and visualization
  "seaborn>=0.12.0",       # 🎨 Beautiful statistical plots
  "plotly>=5.0.0",         # 📊 Interactive plots
]

# 🤖 ML Training & Experiments - Advanced ML features
training = [
  "wandb>=0.15.0",         # 📊 Experiment tracking (Weights & Biases)
  "optuna>=3.3.0",        # 🎯 Hyperparameter optimization
  "tensorboard>=2.14.0",   # 📈 Training visualization (already in main deps)
]

# 🎯 Quick Install Options
all = ["plantguard[dev,docs,jupyter,training]"]  # Everything
basic = ["plantguard[jupyter]"]                  # Just notebooks
full-dev = ["plantguard[dev,docs,jupyter]"]      # Development without ML extras

# 🔗 Project Links - Where to find more info
[project.urls]
"🏠 Homepage" = "https://github.com/arslanmit/PlantGuard"
"📂 Source Code" = "https://github.com/arslanmit/PlantGuard"
"🐛 Bug Reports" = "https://github.com/arslanmit/PlantGuard/issues"
"📖 Documentation" = "https://github.com/arslanmit/PlantGuard/wiki"
"📋 Changelog" = "https://github.com/arslanmit/PlantGuard/releases"
"🚀 Try in Colab" = "https://colab.research.google.com/github/arslanmit/PlantGuard/blob/main/notebooks/PlantGuard.ipynb"

# 🖥️ Command Line Tools - Run PlantGuard from terminal
[project.scripts]
plantguard = "src.plantguard_bot:main"           # Main CLI interface
plantguard-train = "src.training.production_trainer:main"  # Training CLI

# ============================================================================
# 4️⃣ CODE QUALITY - Keep code clean and consistent
# ============================================================================
# 🎯 GOAL: Make code readable, consistent, and bug-free
#
# 🚀 QUICK COMMANDS:
#   make format  - Auto-fix formatting
#   make lint    - Check for issues
#   make fix     - Auto-fix what we can
#   make dev     - Do both format + lint

[tool.mypy]
python_version = "3.11"           # 🐍 Python version we're using
strict = false                    # 🎯 Gradual typing (not too strict while learning)

# ⚠️ Warnings we want to see
warn_return_any = true           # Warn when function returns 'Any' type
warn_unused_configs = true       # Warn about unused MyPy settings
warn_redundant_casts = true      # Warn about unnecessary type casts
warn_unused_ignores = false      # Don't warn about unused # type: ignore
warn_no_return = true            # Warn when function should return something
warn_unreachable = true          # Warn about code that can't be reached
strict_equality = true           # Strict checking for == and !=

# 🏷️ Type annotation requirements
disallow_untyped_defs = true     # Functions need type hints
disallow_incomplete_defs = true  # All parameters need types
check_untyped_defs = true        # Check functions even without types
disallow_untyped_decorators = true  # Decorators need types
no_implicit_optional = true      # Be explicit about Optional types

# 🧠 ML-specific MyPy settings
disable_error_code = [
    "misc",              # Allow miscellaneous type issues - ML code often has complex patterns
    "no-untyped-def",    # Allow functions without type annotations - rapid ML prototyping
    "assignment",        # Allow type assignment mismatches - common in ML with dynamic types
    "attr-defined",      # Allow missing attributes - ML objects often have dynamic attributes
    "index",             # Allow indexing issues - ML data structures can be complex
    "name-defined",      # Allow undefined names - ML imports can be conditional
    "arg-type",          # Allow argument type mismatches - ML functions often flexible
    "no-any-return",     # Allow Any returns - ML functions often return dynamic types
    "return-value",      # Allow return type mismatches - ML functions flexible returns
    "valid-type",        # Allow invalid type annotations - ML code often experimental
    "var-annotated",     # Allow missing variable annotations - ML variables often inferred
    "operator",          # Allow operator type issues - ML tensor operations flexible
    "import",            # Allow import errors for optional ML dependencies
    "import-untyped",    # Allow imports from untyped modules - common in ML ecosystem
    "has-type",          # Allow variables with undetermined types - common in ML training loops
    "import-not-found",  # Allow missing imports - common in ML development
]

# Disable all error checking for problematic files
[[tool.mypy.overrides]]
module = "final_cleanup"
ignore_errors = true

[[tool.mypy.overrides]]
module = "final_optimization"
ignore_errors = true

[[tool.mypy.overrides]]
module = "deploy_improvements"
ignore_errors = true

[[tool.mypy.overrides]]
module = "fix_model_issues"
ignore_errors = true

[[tool.mypy.overrides]]
module = "apply_model_workarounds"
ignore_errors = true

[[tool.mypy.overrides]]
module = "demo_switcher"
ignore_errors = true

[[tool.mypy.overrides]]
module = "verify_deployment"
ignore_errors = true

[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

# 📦 External libraries
ignore_missing_imports = true    # Don't complain about missing library types

# 🚫 Folders to skip (don't type-check these)
exclude = [
  "build/",           # Build artifacts
  "dist/",            # Distribution files
  ".venv/",           # Virtual environment
  ".git/",            # Git files
  "notebooks/",       # Jupyter notebooks (different rules)
  "logs/",            # Log files
  "runs/",            # TensorBoard runs
  ".kiro/",           # Kiro IDE files
  "data/raw/",        # Raw data files
]

# 🎯 Special rules for specific files/modules
[[tool.mypy.overrides]]
module = "src.ui.app_streamlit"
disallow_untyped_decorators = false  # Streamlit decorators don't need types

# 🚧 Work in progress - relax rules for new modules while we add types
[[tool.mypy.overrides]]
module = [
  "src.core.model_manager",
  "src.core.huggingface_vision",
  "src.features.model_switching.model_manager",
  "src.features.model_switching.huggingface_vision",
]
ignore_errors = true  # Skip type checking for now

# 📦 External libraries - ignore missing type information
[[tool.mypy.overrides]]
module = [
  # 🧠 AI/ML Libraries
  "torch.*", "torchvision.*", "torchaudio.*", "torchmetrics.*",

  # 👁️ Computer Vision
  "cv2.*",

  # 🎵 Audio Processing
  "librosa.*", "soundfile.*", "speech_recognition.*",

  # 🌐 Web Interface
  "streamlit.*", "streamlit_webrtc.*",

  # 🔗 Networking
  "pycloudflared.*", "pyngrok.*",

  # 🤖 ML Tools
  "wandb.*", "optuna.*",
]
ignore_missing_imports = true

# ============================================================================
# 6️⃣ TESTING - Make sure everything works correctly
# ============================================================================
# 🎯 GOAL: Catch bugs and ensure PlantGuard works as expected
#
# 🚀 QUICK COMMANDS:
#   make test     - Run all tests
#   make coverage - See test coverage report

# 🧪 Pytest - Testing framework (finds and runs tests)
[tool.pytest.ini_options]
minversion = "7.0"                    # Minimum pytest version

# 🔧 Test options (what pytest does when running)
addopts = [
  "-ra",                              # Show summary of all test results
  "--strict-markers",                 # Only allow defined test markers
  "--strict-config",                  # Strict configuration checking
  "--cov=src",                        # Measure code coverage for src/ folder
  "--cov-report=term-missing:skip-covered",  # Show missing lines in terminal
  "--cov-report=html:htmlcov",        # Generate HTML coverage report
  "--cov-report=xml",                 # Generate XML coverage report
  "--cov-fail-under=80",              # Fail if coverage is below 80%
]

# 📁 Where to find tests and how to recognize them
testpaths = ["tests"]                 # Look for tests in tests/ folder
python_files = ["test_*.py", "*_test.py"]     # Files that contain tests
python_classes = ["Test*"]            # Test classes start with "Test"
python_functions = ["test_*"]         # Test functions start with "test_"

# 🏷️ Test markers (categories for organizing tests)
markers = [
  "slow: marks tests as slow (skip with: pytest -m 'not slow')",
  "integration: marks tests as integration tests (test multiple components)",
  "unit: marks tests as unit tests (test single functions)",
  "gpu: marks tests that require GPU (skip if no GPU available)",
  "model: marks tests that require trained models",
]

# ⚠️ Warning filters (what warnings to show/hide)
filterwarnings = [
  "error",                            # Treat warnings as errors (strict)
  "ignore::UserWarning",              # Ignore user warnings (common in ML)
  "ignore::DeprecationWarning",       # Ignore deprecation warnings
  "ignore::PendingDeprecationWarning", # Ignore pending deprecation warnings
]

# 📊 Test Coverage - How much of our code is tested
[tool.coverage.run]
source = ["src"]                      # Measure coverage for src/ folder
branch = true                         # Track branch coverage (if/else paths)

# 🚫 Files to skip when measuring coverage
omit = [
  "*/tests/*",                        # Don't measure test files themselves
  "*/test_*",                         # Skip test files
  "*/__pycache__/*",                  # Skip Python cache files
  "*/site-packages/*",                # Skip external libraries
  "setup.py",                         # Skip setup script
]

[tool.coverage.report]
# 🚫 Lines to exclude from coverage (code that doesn't need testing)
exclude_lines = [
  "pragma: no cover",                 # Explicit exclusion comment
  "def __repr__",                     # String representation methods
  "if self.debug:",                   # Debug-only code
  "if settings.DEBUG",                # Debug settings
  "raise AssertionError",             # Assertion errors
  "raise NotImplementedError",        # Not implemented methods
  "if 0:",                            # Dead code
  "if __name__ == .__main__.:",       # Script entry points
  "class .*\\bProtocol\\):",          # Protocol classes
  "@(abc\\.)?abstractmethod",         # Abstract methods
]

show_missing = true                   # Show which lines aren't covered
skip_covered = true                   # Don't show fully covered files

[tool.coverage.html]
directory = "htmlcov"                 # Where to put HTML coverage report

# ============================================================================
# 7️⃣ SECURITY - Keep PlantGuard safe from vulnerabilities
# ============================================================================
# 🎯 GOAL: Find potential security issues in code
#
# 🚀 QUICK COMMANDS:
#   make security - Run security scan

# 🔒 Bandit - Security linter (finds potential security issues)
[tool.bandit]
# 🚫 Folders to skip during security scan
exclude_dirs = ["tests", "build", "dist", ".venv"]

# 🚫 Security checks to skip (because they're OK for PlantGuard)
skips = [
  "B101",  # assert statements (OK for debugging and development)
  "B601",  # shell injection (we control the shell commands)
  "B614",  # PyTorch model loading (we trust our local model files)
  "B615",  # Hugging Face downloads (managed through our model config)
]

# ============================================================================
# 8️⃣ DEVELOPMENT WORKFLOW - Helpful tools and automation
# ============================================================================

# 🪝 Pre-commit Configuration Reference
# =====================================
# 💡 Pre-commit runs checks automatically before each git commit
#
# 🚀 SETUP:
#   make setup  (installs pre-commit hooks automatically)
#
# 📝 To create .pre-commit-config.yaml manually:
#
# repos:
#   - repo: https://github.com/astral-sh/ruff-pre-commit
#     rev: v0.1.6
#     hooks:
#       - id: ruff
#         args: [--fix]
#       - id: ruff-format
#   - repo: https://github.com/pre-commit/mirrors-mypy
#     rev: v1.6.1
#     hooks:
#       - id: mypy
#         additional_dependencies: [types-all]

# ============================================================================
# 9️⃣ PACKAGE BUILDING - How to create installable PlantGuard packages
# ============================================================================
# 🎯 GOAL: Configure how Python packages PlantGuard for distribution
#
# 🚀 QUICK COMMANDS:
#   make build   - Build package for distribution
#   pip install -e .  - Install PlantGuard in development mode

[tool.ruff]
line-length = 200              # 📏 Max characters per line (ADHD-friendly: not too long)
target-version = "py311"       # 🐍 Python version we support
fix = true                     # 🔧 Auto-fix issues when possible
show-fixes = true              # 📝 Show what was fixed
output-format = "grouped"      # 📊 Group similar issues together

# 🔍 What Ruff checks for (the rules we follow)
[tool.ruff.lint]
select = [
  # ============================================================================
  # 🐍 CORE PYTHON RULES - The absolute basics everyone should follow
  # ============================================================================
  "E",   # pycodestyle errors (spacing, indentation, line length)
  "F",   # pyflakes (unused imports, undefined variables, syntax errors)
  "I",   # isort (organize imports nicely by category)

  # ============================================================================
  # 🐛 BUG PREVENTION - Catch common Python mistakes and gotchas
  # ============================================================================
  "B",   # flake8-bugbear (common Python gotchas and anti-patterns)
  "A",   # flake8-builtins (don't shadow built-ins like 'list', 'dict')
  "C4",  # flake8-comprehensions (better list/dict comprehensions)
  "PIE", # flake8-pie (miscellaneous improvements and simplifications)
  "SIM", # flake8-simplify (simpler, more readable code patterns)
  "UP",  # pyupgrade (modern Python syntax, f-strings, type hints)

  # ============================================================================
  # 📝 DOCUMENTATION & TYPE SAFETY - Make code self-documenting
  # ============================================================================
  "ANN", # flake8-annotations (type hints for functions and variables)
  "D",   # pydocstyle (docstring style and completeness)

  # ============================================================================
  # 🔒 SECURITY & ERROR HANDLING - Keep code safe and robust
  # ============================================================================
  "S",   # flake8-bandit (security vulnerabilities and unsafe patterns)
  "BLE", # flake8-blind-except (catch specific exceptions, not bare except)
  "TRY", # tryceratops (better exception handling patterns)

  # ============================================================================
  # 🧠 CODE COMPLEXITY - Keep it simple and maintainable (ADHD-friendly!)
  # ============================================================================
  "C90", # mccabe (cyclomatic complexity - how many paths through functions)
  "PLR", # pylint refactor (code structure, complexity, design issues)
  "PLW", # pylint warnings (potential bugs, unused variables, etc.)
  "PLE", # pylint errors (definite bugs and errors)

  # ============================================================================
  # 🚀 MODERN PYTHON - Use the latest best practices and features
  # ============================================================================
  "PTH", # flake8-use-pathlib (use pathlib.Path instead of os.path)
  "RUF", # ruff-specific rules (unique to Ruff linter)

  # ============================================================================
  # ⚡ PERFORMANCE - Make code faster and more efficient
  # ============================================================================
  "PERF", # perflint (performance improvements and optimizations)

  # ============================================================================
  # 📦 IMPORT & CODE ORGANIZATION - Clean, organized, readable code
  # ============================================================================
  "TID", # flake8-tidy-imports (import organization and banned imports)

  # ============================================================================
  # 🖨️ LOGGING & OUTPUT - Proper logging instead of print statements
  # ============================================================================
  "G",   # flake8-logging-format (proper logging format and usage)
  "T20", # flake8-print (discourage print(), encourage logging)

  # ============================================================================
  # 🔧 ADDITIONAL RULE CATEGORIES - Future-ready and optional
  # ============================================================================
  # 💡 Add # before any category to deactivate it, remove # to activate

  # 🧪 TESTING - Test code quality
  # "PT",  # flake8-pytest-style (pytest best practices)

  # 🎨 CODE STYLE - Additional style rules
  # "COM", # flake8-commas (trailing commas)
  # "Q",   # flake8-quotes (quote style consistency)

  # 🔍 CODE ANALYSIS - Advanced analysis
  # "ERA", # eradicate (commented-out code detection)
  # "FBT", # flake8-boolean-trap (boolean trap anti-pattern)
  # "ARG", # flake8-unused-arguments (unused function arguments)

  # 🔄 COMPATIBILITY & MODERNIZATION
  # "YTT", # flake8-2020 (Python 2/3 compatibility)
  # "FURB", # refurb (code modernization and improvements)

  # 🌐 FRAMEWORK-SPECIFIC
  # "DJ",  # flake8-django (Django best practices)
  # "PD",  # pandas-vet (Pandas best practices)

  # � FUTURE CAATEGORIES - Add as they become available
  # "ASYNC", # flake8-async (async/await best practices)
  # "NPY",   # numpy-specific rules
  # "CRYPT", # cryptography best practices
  # "DOC",   # documentation generation rules
]

ignore = [
  # ============================================================================
  # � PYFRLAKES (F) - Core Python issues
  # ============================================================================
  "F841",   # Allow unused variables - ML experiments often have intermediate variables for debugging
  "F821",   # Allow undefined names - ML code often has conditional imports
  "F401",   # Allow unused imports - ML code often imports for type checking or optional features

  # ============================================================================
  # 🎨 PYCODESTYLE (E) - Code style and formatting
  # ============================================================================
  "E501",   # Allow long lines - ML code often has long parameter lists and tensor operations
  "E701",   # Allow multiple statements on one line - ML code sometimes needs compact expressions
  "E702",   # Allow multiple statements on one line - ML code sometimes needs compact expressions
  "E203",   # Allow whitespace before ':' - conflicts with black formatter in ML tensor slicing
  "E402",   # Allow module level import not at top of file - ML scripts often have conditional imports

  # ============================================================================
  # 📦 ISORT (I) - Import organization and sorting
  # ============================================================================
  "I001",   # Allow unsorted imports - ML experiments often have dynamic import patterns during development
  # "I002",   # missing required import (e.g. from __future__ import annotations)

  # ============================================================================
  # 🔤 FLAKE8-BUILTINS (A) - Builtin shadowing
  # ============================================================================
  "A001",   # Allow variable shadowing builtins - ML code commonly uses 'input', 'output', 'filter', 'format', 'type'
  "A002",   # Allow argument shadowing builtins - ML function parameters often use 'input', 'output', 'format'
  "A003",   # Allow class attribute shadowing builtins - ML model classes often have 'input', 'output' attributes
  # "A004",   # import is shadowing a python builtin
  # "A005",   # module is shadowing a python builtin
  # "A006",   # variable is shadowing a python builtin in a nested scope

  # ============================================================================
  # 🐛 FLAKE8-BUGBEAR (B) - Common Python gotchas and bugs
  # ============================================================================
  # "B002",   # Python does not support the unary prefix increment
  # "B003",   # assigning to os.environ doesn't clear the environment
  # "B004",   # using hasattr(x, '__call__') to test if x is callable is unreliable
  # "B005",   # using .strip() with multi-character strings is misleading
  "B006",   # Allow mutable defaults - ML model configs and data processing functions often use mutable defaults
  "B007",   # Allow unused loop variables - common in ML training epochs and batch processing where index isn't used
  "B008",   # Allow function calls in defaults - ML often has computed defaults like device detection, model paths
  # "B009",   # do not call getattr with a constant attribute value
  # "B010",   # do not call setattr with a constant attribute value
  # "B011",   # do not call assert False since python -O removes these calls
  # "B012",   # use of break, continue or return inside finally blocks
  # "B013",   # a length-one tuple literal is redundant
  # "B014",   # exception handler is an exception group
  # "B015",   # pointless comparison
  # "B016",   # cannot raise a literal
  # "B017",   # assertRaises(Exception) should be considered evil
  "B018",   # Allow useless expressions - ML code often has tensor operations with side effects (GPU memory, model state)
  # "B019",   # use of assert detected
  # "B020",   # loop control variable overrides iterable it iterates
  # "B021",   # f-string used as docstring
  # "B022",   # no arguments passed to contextmanager
  "B023",   # Allow unbound loop variables in function definitions - common in ML training loop callbacks
  # "B024",   # abstract base class with no abstract methods
  # "B025",   # duplicate try block exception handler
  # "B026",   # star-arg unpacking after a keyword argument is strongly discouraged
  # "B027",   # empty method in an abstract base class
  # "B028",   # no explicit stacklevel keyword argument found
  # "B029",   # using except (...): with an empty tuple does not catch anything
  # "B030",   # except handlers should only be exception classes or tuples of exception classes
  # "B031",   # using itertools.groupby without explicitly sorting first
  # "B032",   # possible unintentional type annotation (use =)
  # "B033",   # duplicate value in set
  # "B034",   # re.sub called with positional arguments
  # "B035",   # found except clause that may not bind an exception
  # "B901",   # using return x in a generator function used to be syntactically invalid
  # "B902",   # blind except Exception: statement
  # "B903",   # data class should use __slots__
