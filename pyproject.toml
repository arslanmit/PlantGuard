# =========================
# Python strict config (similar to Dart analysis_options.yaml)
# =========================

[tool.ruff]
line-length = 100          # Maximum characters per line - keeps code readable
target-version = "py313"   # Target Python 3.13 for latest syntax features
fix = true                 # Automatically fix issues when possible

# Comprehensive rule set covering all aspects of code quality:
# E,F,W(pyflakes/pycodestyle), I(isort), B(bugbear), A(builtins),
# ANN(annotations), N(naming), S(security/bandit), BLE(blind-except),
# C90(mccabe), C4(comprehensions), DTZ(datetime tz), EM(errmsg),
# ISC(implicit-str-concat), G(logging-format), PTH(pathlib),
# PIE(misc), PT(pytest), Q(quotes), RET(returns), RSE(raise),
# SIM(simplify), T20(print), TID(tidy-imports), TRY(exceptions),
# UP(pyupgrade), PGH(pragma-handling), PERF(performance),
# PL(pylint alternative rules), RUF(ruff internal)
[tool.ruff.lint]
# Comprehensive rule set for strict code quality
select = [
    "E",    # pycodestyle errors - PEP 8 style violations
    "F",    # pyflakes - logical errors and unused imports
    "W",    # pycodestyle warnings - style warnings
    "I",    # isort - import sorting and organization
    "B",    # flake8-bugbear - common Python gotchas
    "A",    # flake8-builtins - avoid shadowing built-ins
    "ANN",  # flake8-annotations - enforce type annotations
    "N",    # pep8-naming - naming conventions
    "S",    # flake8-bandit - security vulnerabilities
    "BLE",  # flake8-blind-except - avoid bare except clauses
    "C90",  # mccabe - cyclomatic complexity
    "C4",   # flake8-comprehensions - list/dict comprehension improvements
    "DTZ",  # flake8-datetimez - timezone-aware datetime usage
    "EM",   # flake8-errmsg - error message formatting
    "ISC",  # flake8-implicit-str-concat - implicit string concatenation
    "G",    # flake8-logging-format - logging format strings
    "PTH",  # flake8-use-pathlib - prefer pathlib over os.path
    "PIE",  # flake8-pie - miscellaneous linting rules
    "PT",   # flake8-pytest-style - pytest best practices
    "Q",    # flake8-quotes - quote style consistency
    "RET",  # flake8-return - return statement improvements
    "RSE",  # flake8-raise - raise statement improvements
    "SIM",  # flake8-simplify - code simplification suggestions
    "T20",  # flake8-print - avoid print statements in production
    "TID",  # flake8-tidy-imports - import organization
    "TRY",  # tryceratops - exception handling best practices
    "UP",   # pyupgrade - upgrade syntax for newer Python versions
    "PGH",  # pygrep-hooks - miscellaneous text-based checks
    "PERF", # perflint - performance anti-patterns
    "PL",   # pylint - comprehensive static analysis
    "RUF",  # ruff-specific rules - ruff's own checks
]

# Black compatibility - ignore whitespace before colon
ignore = ["E203"]

# Exclude directories/files from linting
exclude = [
  "build",        # Build artifacts
  ".venv",        # Virtual environment
  ".git",         # Git repository files
  ".mypy_cache",  # MyPy cache files
  ".ruff_cache",  # Ruff cache files
  "dist",         # Distribution packages
  "notebooks",    # Jupyter notebooks directory
  "*.ipynb",      # Individual Jupyter notebook files
  "/Users/umitarslan/Library/Application Support/Kiro/User"  # Kiro user data
]

# Import sorting configuration
[tool.ruff.lint.isort]
known-first-party = ["src","plantguard"]  # Local project modules
known-third-party = ["torch","torchvision","numpy","pandas","streamlit","PIL"]  # External dependencies

# Naming conventions (PEP 8 compliance)
[tool.ruff.lint.pep8-naming]
# Exceptions can be defined here if needed

# Complexity limit (mccabe) - maintainability enforcement
[tool.ruff.lint.mccabe]
max-complexity = 10  # Maximum cyclomatic complexity per function

# Pylint-style limits for code maintainability
[tool.ruff.lint.pylint]
max-args = 6          # Maximum function arguments
max-branches = 12     # Maximum branches in a function
max-returns = 6       # Maximum return statements in a function
max-statements = 50   # Maximum statements in a function

# String/quote preferences (consistent style enforcement)
[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"      # Use double quotes for inline strings
multiline-quotes = "double"   # Use double quotes for multiline strings
docstring-quotes = "double"   # Use double quotes for docstrings
avoid-escape = true           # Avoid unnecessary escape characters

# Type annotation configuration
[tool.ruff.lint.flake8-annotations]  # ANN: enforce return type declarations
mypy-init-return = true        # Require return type for __init__ methods
suppress-dummy-args = false    # Don't suppress dummy argument annotations
allow-star-arg-any = false     # Don't allow Any for *args/**kwargs
ignore-fully-untyped = false  # Don't ignore fully untyped functions
# require-return-type and require-annotation-for-toplevel are not supported in current Ruff version

# Security rules (Bandit equivalent) - security/environment checks
[tool.ruff.lint.flake8-bandit]
check-typed-exception = true  # Check for typed exceptions

# Print statement restrictions (avoid print in production)
[tool.ruff.lint.pycodestyle]
max-doc-length = 120  # Maximum docstring line length

# Test-specific exceptions (uncomment if needed)
# [tool.ruff.lint.per-file-ignores]
# "tests/**" = ["S101","T20"]  # Allow assert/print in tests

# =========================
# Formatter (Black) — format on save
# =========================
[tool.black]
line-length = 100              # Match ruff line length
target-version = ["py313"]     # Target Python 3.13
include = '\.pyi?$'            # Include .py and .pyi files
extend-exclude = '''
/(
  \.eggs|\.git|\.hg|\.mypy_cache|\.tox|\.venv|build|dist  # Standard exclusions
)/
'''

# =========================
# Type Checker (Mypy) — strict type safety
# =========================
[tool.mypy]
python_version = "3.13"           # Target Python version
strict = false                    # Not fully strict mode (gradual typing)
disallow_untyped_defs = true      # Require type annotations for functions
disallow_incomplete_defs = true   # Require complete type annotations
check_untyped_defs = true         # Type-check untyped function bodies
disallow_untyped_decorators = true # Require typed decorators
no_implicit_optional = true       # Don't assume Optional for None defaults
warn_return_any = true            # Warn when returning Any
warn_redundant_casts = true       # Warn about unnecessary casts
warn_unused_ignores = true        # Warn about unused # type: ignore
warn_no_return = true             # Warn about missing return statements
warn_unreachable = true           # Warn about unreachable code
strict_equality = true            # Use strict equality checks
ignore_missing_imports = true     # Ignore missing imports (for third-party)
exclude = '(build|\.venv|dist|tests/fixtures|/Users/umitarslan/Library/Application Support/Kiro/User)'

# Third-party library overrides (ignore missing type stubs)
[[tool.mypy.overrides]]
module = [
  "torch.*","torchvision.*","torchaudio.*","torchmetrics.*",  # PyTorch ecosystem
  "cv2.*","librosa.*","soundfile.*",                          # Computer vision/audio
  "streamlit.*","streamlit_webrtc.*",                         # Streamlit
  "pycloudflared.*","pyngrok.*","speech_recognition.*"        # Tunneling/speech
]
ignore_missing_imports = true

# =========================
# Pytest — testing with coverage
# =========================
[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=src --cov-report=term-missing --cov-report=html"  # Quiet mode, strict markers, coverage reports
testpaths = ["tests"]  # Test directory location