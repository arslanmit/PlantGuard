# =========================
# Build System Configuration
# =========================
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# =========================
# Project Metadata
# =========================
[project]
name = "plantguard"
version = "0.1.0"
description = "Multimodal plant disease detection system with offline ML inference"
authors = [{ name = "PlantGuard Team", email = "umit.arslan@outlook.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "plant",
  "disease",
  "detection",
  "machine-learning",
  "multimodal",
  "computer-vision",
  "agriculture",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: OS Independent",
]

# Core dependencies organized by category
dependencies = [
  # Deep Learning Framework
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "torchaudio>=2.1.0",
  "torchmetrics>=1.2.0",

  # Data Science & ML
  "numpy>=1.24.0",
  "pandas>=2.1.0",
  "scikit-learn>=1.3.0",

  # Computer Vision & Image Processing
  "opencv-python-headless>=4.8.0",
  "Pillow>=10.0.0",

  # NLP & Transformers
  "transformers>=4.34.0",
  "accelerate>=0.24.0",
  "datasets>=2.14.0",

  # Audio Processing
  "librosa>=0.10.1",
  "soundfile>=0.12.1",
  "SpeechRecognition>=3.10.0",

  # Web UI & Deployment
  "streamlit>=1.27.0",
  "streamlit-webrtc>=0.47.0",
  "pycloudflared>=0.2.0",
  "pyngrok>=7.0.0",

  # Utilities
  "python-dotenv>=1.0.0",
  "tensorboard>=2.14.0",
]

[project.optional-dependencies]
# Development tools
dev = [
  "ruff>=0.1.0",
  "mypy>=1.6.0",
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.12.0",
  "bandit>=1.7.5",
  "safety>=3.0.0",
  "pre-commit>=3.0.0",
]

# Documentation tools
docs = ["sphinx>=7.0.0", "sphinx-rtd-theme>=2.0.0", "myst-parser>=2.0.0"]

# Jupyter and analysis tools
jupyter = [
  "jupyter>=1.0.0",
  "ipykernel>=6.25.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
]

# Training and experimentation
training = ["wandb>=0.15.0", "optuna>=3.3.0", "tensorboard>=2.14.0"]

# All optional dependencies
all = ["plantguard[dev,docs,jupyter,training]"]

[project.urls]
Homepage = "https://github.com/arslanmit/PlantGuard"
Repository = "https://github.com/arslanmit/PlantGuard"
Issues = "https://github.com/arslanmit/PlantGuard/issues"
Documentation = "https://github.com/arslanmit/PlantGuard/wiki"
Changelog = "https://github.com/arslanmit/PlantGuard/releases"

[project.scripts]
plantguard = "plantguard.cli:main"
plantguard-train = "plantguard.training:main"

# =========================
# Ruff Configuration - Modern Python Linter & Formatter
# =========================
[tool.ruff]
line-length = 100
target-version = "py311"  # Support Python 3.11+ for broader compatibility
fix = true
show-fixes = true
output-format = "grouped"

[tool.ruff.lint]
# Comprehensive rule selection for high code quality
select = [
  # Core Python rules
  "E", # pycodestyle errors
  "F", # pyflakes
  "W", # pycodestyle warnings
  "I", # isort - import sorting

  # Code quality and best practices
  "B",   # flake8-bugbear - common bugs
  "A",   # flake8-builtins - builtin shadowing
  "C4",  # flake8-comprehensions
  "PIE", # flake8-pie - misc improvements
  "SIM", # flake8-simplify
  "UP",  # pyupgrade - modern Python syntax

  # Type annotations and documentation
  "ANN", # flake8-annotations
  "D",   # pydocstyle - docstring conventions

  # Security and error handling
  "S",   # flake8-bandit - security
  "BLE", # flake8-blind-except
  "TRY", # tryceratops - exception handling

  # Code complexity and maintainability
  "C90", # mccabe - complexity
  "PLR", # pylint refactor
  "PLW", # pylint warnings
  "PLE", # pylint errors

  # Modern Python practices
  "PTH", # flake8-use-pathlib
  "RUF", # ruff-specific rules

  # Performance
  "PERF", # perflint

  # Import organization
  "TID", # flake8-tidy-imports

  # Logging and print statements
  "G",   # flake8-logging-format
  "T20", # flake8-print
]

# Ignore specific rules that conflict with project needs
ignore = [
  "E501",   # Line too long (formatter handles this automatically)
  "E203",   # Whitespace before ':' (conflicts with Black formatter)
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D107",   # Missing docstring in __init__
  "S603",   # subprocess call without shell=True check
  "PLR0913",# Too many arguments in function definition
  "C901",   # Function is too complex (cyclomatic complexity)
  "TRY400", # Use logging.exception instead of logging.error
  "PTH118", # os.path.join should be replaced with Path operator
  "PTH109", # os.getcwd() should be replaced with Path.cwd()
  "PTH110", # os.path.exists() should be replaced with Path.exists()
  "PLR0912",# Too many branches in function
  "PLR2004",# Magic value used in comparison
  "PLR0915",# Too many statements in function
  "TRY300", # Consider moving statement to else block
  "BLE001", # Do not catch blind exception: Exception
  "G004",   # Logging statement uses f-string
  "TRY003",
  "PTH123",
  "B904",
  "S607",
  "S110",
  "PLW0603",
  "F841"
]

# Per-file ignores for different file types
[tool.ruff.lint.per-file-ignores]
# Test files are allowed to use assert statements and print for debugging
"tests/**/*.py" = [
  "S101",   # Use of assert detected (allowed in tests)
  "T201",   # Print found (allowed in test debugging)
  "ANN001", # Missing type annotation for function argument (relaxed for tests)
  "ANN201", # Missing return type annotation (relaxed for tests)
  "D102",   # Missing docstring in public method (relaxed for tests)
  "D103",   # Missing docstring in public function (relaxed for tests)
]
# Scripts are allowed to use print statements for CLI output
"scripts/**/*.py" = [
  "T201",   # Print found (allowed in scripts for CLI output)
  "D103",   # Missing docstring in public function (relaxed for scripts)
]
# Notebooks are allowed to use print statements
"notebooks/**/*.py" = [
  "T201",   # Print found (allowed in notebooks)
]
# Jupyter notebooks (.ipynb files) are allowed to use print statements
"notebooks/**/*.ipynb" = [
  "T201",   # Print found (allowed in notebooks)
]

# Import sorting configuration
[tool.ruff.lint.isort]
known-first-party = ["plantguard", "src"]
known-third-party = [
  "torch",
  "torchvision",
  "torchaudio",
  "torchmetrics",
  "numpy",
  "pandas",
  "sklearn",
  "cv2",
  "PIL",
  "transformers",
  "datasets",
  "accelerate",
  "librosa",
  "soundfile",
  "speech_recognition",
  "streamlit",
  "streamlit_webrtc",
  "matplotlib",
  "seaborn",
  "plotly",
  "pytest",
  "wandb",
  "optuna",
]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
split-on-trailing-comma = true
force-single-line = false

# Docstring configuration
[tool.ruff.lint.pydocstyle]
convention = "google" # Use Google-style docstrings

# Complexity limits
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8        # Increased for ML models
max-branches = 12
max-returns = 6
max-statements = 50

# Quote style
[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

# Type annotation enforcement
[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-dummy-args = true
allow-star-arg-any = false
ignore-fully-untyped = false

# Security configuration
[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

# Formatter configuration
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# =========================
# MyPy - Static Type Checking
# =========================
[tool.mypy]
python_version = "3.11"
strict = false                     # Gradual typing approach
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
strict_equality = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
ignore_missing_imports = true

# Exclude patterns
exclude = [
  "build/",
  "dist/",
  ".venv/",
  ".git/",
  "notebooks/",
  "logs/",
  "runs/",
  ".kiro/",

]

# File-specific overrides
[[tool.mypy.overrides]]
module = "src.ui.app_streamlit"
disallow_untyped_decorators = false  # Allow @st.cache_resource without type annotations

# Temporarily relax strictness for newly-added core modules while stabilizing types
[[tool.mypy.overrides]]
module = [
  "src.core.model_manager",
  "src.core.huggingface_vision",
  "src.features.model_switching.model_manager",
  "src.features.model_switching.huggingface_vision",
]
ignore_errors = true

# Third-party library stubs
[[tool.mypy.overrides]]
module = [
  "torch.*",
  "torchvision.*",
  "torchaudio.*",
  "torchmetrics.*",
  "cv2.*",
  "librosa.*",
  "soundfile.*",
  "streamlit.*",
  "streamlit_webrtc.*",
  "pycloudflared.*",
  "pyngrok.*",
  "speech_recognition.*",
  "wandb.*",
  "optuna.*",
]
ignore_missing_imports = true

# =========================
# Pytest - Testing Framework
# =========================
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=src",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=html:htmlcov",
  "--cov-report=xml",
  "--cov-fail-under=80",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "gpu: marks tests that require GPU",
]
filterwarnings = [
  "error",
  "ignore::UserWarning",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

# =========================
# Coverage Configuration
# =========================
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
  "*/tests/*",
  "*/test_*",
  "*/__pycache__/*",
  "*/site-packages/*",
  "setup.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"

# =========================
# Bandit - Security Linting
# =========================
[tool.bandit]
exclude_dirs = ["tests", "build", "dist", ".venv"]
skips = [
  "B101",  # assert_used
  "B601",  # shell_injection
  "B614",  # pytorch_load (acceptable for local trusted weights)
  "B615",  # huggingface_unsafe_download (managed via model config)
]

# =========================
# Pre-commit Configuration Reference
# =========================
# Create .pre-commit-config.yaml with:
# repos:
#   - repo: https://github.com/astral-sh/ruff-pre-commit
#     rev: v0.1.6
#     hooks:
#       - id: ruff
#         args: [--fix]
#       - id: ruff-format
#   - repo: https://github.com/pre-commit/mirrors-mypy
#     rev: v1.6.1
#     hooks:
#       - id: mypy
#         additional_dependencies: [types-all]

# =========================
# Setuptools Configuration
# =========================
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["plantguard*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
plantguard = ["py.typed", "*.json", "*.yaml", "*.yml"]
