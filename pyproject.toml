# 📦 Import Organization - Keep imports clean and organized
[tool.ruff.lint.isort]
# 🏠 Our code (PlantGuard modules)
known-first-party = ["plantguard", "src"]

# 🌐 External libraries we use (organized by category for ADHD-friendly reading)
known-third-party = [
  # 🧠 AI/ML Core
  "torch", "torchvision", "torchaudio", "torchmetrics",

  # 📊 Data Science
  "numpy", "pandas", "sklearn",

  # 👁️ Computer Vision
  "cv2", "PIL",

  # 🤗 Hugging Face
  "transformers", "datasets", "accelerate",

  # 🎵 Audio
  "librosa", "soundfile", "speech_recognition",

  # 🌐 Web Interface
  "streamlit", "streamlit_webrtc",

  # 📈 Visualization
  "matplotlib", "seaborn", "plotly",

  # 🧪 Testing & ML Tools
  "pytest", "wandb", "optuna",
]

# 📋 Import order (top to bottom in files)
section-order = [
  "future",          # from __future__ import ...
  "standard-library", # Built-in Python modules (os, sys, etc.)
  "third-party",     # External packages (torch, numpy, etc.)
  "first-party",     # Our PlantGuard code
  "local-folder",    # Relative imports (from . import ...)
]

split-on-trailing-comma = true  # Split long import lists nicely
force-single-line = false       # Allow multiple imports per line when short

# 📝 Documentation Style - How we write docstrings
[tool.ruff.lint.pydocstyle]
convention = "google"  # Use Google-style docstrings (clear and readable)

# 🧠 Complexity Limits - Keep functions simple (ADHD-friendly!)
[tool.ruff.lint.mccabe]
max-complexity = 10    # Max cyclomatic complexity (how many paths through a function)

[tool.ruff.lint.pylint]
max-args = 8          # Max function arguments (ML functions need more params)
max-branches = 12     # Max if/elif branches
max-returns = 6       # Max return statements
max-statements = 50   # Max lines in a function

# 📝 Quote Style - Consistent string quotes
[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"      # Use "double quotes" for strings
multiline-quotes = "double"   # Use """double quotes""" for multi-line
docstring-quotes = "double"   # Use """double quotes""" for docstrings
avoid-escape = true           # Avoid escaping quotes when possible

# 🏷️ Type Annotations - Gradual typing approach
[tool.ruff.lint.flake8-annotations]
mypy-init-return = true       # __init__ methods should return None
suppress-dummy-args = true    # Don't require types for *args, **kwargs
allow-star-arg-any = false    # Require specific types for *args
ignore-fully-untyped = false # Check all functions, even without types

# 🔒 Security Settings
[tool.ruff.lint.flake8-bandit]
check-typed-exception = true  # Check exception handling

# 🎨 Code Formatting - How code looks
[tool.ruff.format]
quote-style = "double"    # Use "double quotes"
indent-style = "space"    # Use spaces, not tabs
line-ending = "auto"      # Auto-detect line endings (Windows/Mac/Linux)

# ============================================================================
# 5️⃣ TYPE CHECKING - Catch bugs before they happen
# ============================================================================
# 🎯 GOAL: Find type-related bugs early (like using a string as a number)
#
# 🚀 QUICK COMMANDS:
#   make type    - Check types
#   make dev     - Includes type checking

# 🔍 MyPy - Static type checker (finds bugs without running code)
[tool.mypy]
python_version = "3.11"           # 🐍 Python version we're using
strict = false                    # 🎯 Gradual typing (not too strict while learning)

# ⚠️ Warnings we want to see
warn_return_any = true           # Warn when function returns 'Any' type
warn_unused_configs = true       # Warn about unused MyPy settings
warn_redundant_casts = true      # Warn about unnecessary type casts
warn_unused_ignores = false      # Don't warn about unused # type: ignore
warn_no_return = true            # Warn when function should return something
warn_unreachable = true          # Warn about code that can't be reached
strict_equality = true           # Strict checking for == and !=

# 🏷️ Type annotation requirements
disallow_untyped_defs = true     # Functions need type hints
disallow_incomplete_defs = true  # All parameters need types
check_untyped_defs = true        # Check functions even without types
disallow_untyped_decorators = true  # Decorators need types
no_implicit_optional = true      # Be explicit about Optional types

# 📦 External libraries
ignore_missing_imports = true    # Don't complain about missing library types

# 🚫 Folders to skip (don't type-check these)
exclude = [
  "build/",           # Build artifacts
  "dist/",            # Distribution files
  ".venv/",           # Virtual environment
  ".git/",            # Git files
  "notebooks/",       # Jupyter notebooks (different rules)
  "logs/",            # Log files
  "runs/",            # TensorBoard runs
  ".kiro/",           # Kiro IDE files
  "data/raw/",        # Raw data files
]

# 🎯 Special rules for specific files/modules
[[tool.mypy.overrides]]
module = "src.ui.app_streamlit"
disallow_untyped_decorators = false  # Streamlit decorators don't need types

# 🚧 Work in progress - relax rules for new modules while we add types
[[tool.mypy.overrides]]
module = [
  "src.core.model_manager",
  "src.core.huggingface_vision",
  "src.features.model_switching.model_manager",
  "src.features.model_switching.huggingface_vision",
]
ignore_errors = true  # Skip type checking for now

# 📦 External libraries - ignore missing type information
[[tool.mypy.overrides]]
module = [
  # 🧠 AI/ML Libraries
  "torch.*", "torchvision.*", "torchaudio.*", "torchmetrics.*",

  # 👁️ Computer Vision
  "cv2.*",

  # 🎵 Audio Processing
  "librosa.*", "soundfile.*", "speech_recognition.*",

  # 🌐 Web Interface
  "streamlit.*", "streamlit_webrtc.*",

  # 🔗 Networking
  "pycloudflared.*", "pyngrok.*",

  # 🤖 ML Tools
  "wandb.*", "optuna.*",
]
ignore_missing_imports = true

# ============================================================================
# 6️⃣ TESTING - Make sure everything works correctly
# ============================================================================
# 🎯 GOAL: Catch bugs and ensure PlantGuard works as expected
#
# 🚀 QUICK COMMANDS:
#   make test     - Run all tests
#   make coverage - See test coverage report

# 🧪 Pytest - Testing framework (finds and runs tests)
[tool.pytest.ini_options]
minversion = "7.0"                    # Minimum pytest version

# 🔧 Test options (what pytest does when running)
addopts = [
  "-ra",                              # Show summary of all test results
  "--strict-markers",                 # Only allow defined test markers
  "--strict-config",                  # Strict configuration checking
  "--cov=src",                        # Measure code coverage for src/ folder
  "--cov-report=term-missing:skip-covered",  # Show missing lines in terminal
  "--cov-report=html:htmlcov",        # Generate HTML coverage report
  "--cov-report=xml",                 # Generate XML coverage report
  "--cov-fail-under=80",              # Fail if coverage is below 80%
]

# 📁 Where to find tests and how to recognize them
testpaths = ["tests"]                 # Look for tests in tests/ folder
python_files = ["test_*.py", "*_test.py"]     # Files that contain tests
python_classes = ["Test*"]            # Test classes start with "Test"
python_functions = ["test_*"]         # Test functions start with "test_"

# 🏷️ Test markers (categories for organizing tests)
markers = [
  "slow: marks tests as slow (skip with: pytest -m 'not slow')",
  "integration: marks tests as integration tests (test multiple components)",
  "unit: marks tests as unit tests (test single functions)",
  "gpu: marks tests that require GPU (skip if no GPU available)",
  "model: marks tests that require trained models",
]

# ⚠️ Warning filters (what warnings to show/hide)
filterwarnings = [
  "error",                            # Treat warnings as errors (strict)
  "ignore::UserWarning",              # Ignore user warnings (common in ML)
  "ignore::DeprecationWarning",       # Ignore deprecation warnings
  "ignore::PendingDeprecationWarning", # Ignore pending deprecation warnings
]

# 📊 Test Coverage - How much of our code is tested
[tool.coverage.run]
source = ["src"]                      # Measure coverage for src/ folder
branch = true                         # Track branch coverage (if/else paths)

# 🚫 Files to skip when measuring coverage
omit = [
  "*/tests/*",                        # Don't measure test files themselves
  "*/test_*",                         # Skip test files
  "*/__pycache__/*",                  # Skip Python cache files
  "*/site-packages/*",                # Skip external libraries
  "setup.py",                         # Skip setup script
]

[tool.coverage.report]
# 🚫 Lines to exclude from coverage (code that doesn't need testing)
exclude_lines = [
  "pragma: no cover",                 # Explicit exclusion comment
  "def __repr__",                     # String representation methods
  "if self.debug:",                   # Debug-only code
  "if settings.DEBUG",                # Debug settings
  "raise AssertionError",             # Assertion errors
  "raise NotImplementedError",        # Not implemented methods
  "if 0:",                            # Dead code
  "if __name__ == .__main__.:",       # Script entry points
  "class .*\\bProtocol\\):",          # Protocol classes
  "@(abc\\.)?abstractmethod",         # Abstract methods
]

show_missing = true                   # Show which lines aren't covered
skip_covered = true                   # Don't show fully covered files

[tool.coverage.html]
directory = "htmlcov"                 # Where to put HTML coverage report

# ============================================================================
# 7️⃣ SECURITY - Keep PlantGuard safe from vulnerabilities
# ============================================================================
# 🎯 GOAL: Find potential security issues in code
#
# 🚀 QUICK COMMANDS:
#   make security - Run security scan

# 🔒 Bandit - Security linter (finds potential security issues)
[tool.bandit]
# 🚫 Folders to skip during security scan
exclude_dirs = ["tests", "build", "dist", ".venv"]

# 🚫 Security checks to skip (because they're OK for PlantGuard)
skips = [
  "B101",  # assert statements (OK for debugging and development)
  "B601",  # shell injection (we control the shell commands)
  "B614",  # PyTorch model loading (we trust our local model files)
  "B615",  # Hugging Face downloads (managed through our model config)
]

# ============================================================================
# 8️⃣ DEVELOPMENT WORKFLOW - Helpful tools and automation
# ============================================================================

# 🪝 Pre-commit Configuration Reference
# =====================================
# 💡 Pre-commit runs checks automatically before each git commit
#
# 🚀 SETUP:
#   make setup  (installs pre-commit hooks automatically)
#
# 📝 To create .pre-commit-config.yaml manually:
#
