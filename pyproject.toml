# ============================================================================
# 9️⃣ PACKAGE BUILDING - How to create installable PlantGuard packages
# ============================================================================
# 🎯 GOAL: Configure how Python packages PlantGuard for distribution
#
# 🚀 QUICK COMMANDS:
#   make build   - Build package for distribution
#   pip install -e .  - Install PlantGuard in development mode

# 📦 Setuptools - Python packaging tool
[tool.setuptools]
package-dir = { "" = "src" }          # Source code is in src/ folder

[tool.setuptools.packages.find]
where = ["src"]                       # Look for packages in src/
include = ["plantguard*"]             # Include all plantguard packages
exclude = ["tests*"]                  # Don't include test packages

[tool.setuptools.package-data]
plantguard = [
  "py.typed",                         # Type information file
  "*.json",                           # Configuration files
  "*.yaml", "*.yml",                  # YAML configuration files
]

