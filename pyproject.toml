# ============================================================================
# 🌿 PlantGuard - AI Plant Disease Detection System
# ============================================================================
# This file configures the entire PlantGuard project
#
# 🚀 QUICK START:
#   make setup    - Install everything
#   make run      - Launch the app
#   make dev      - Development workflow
#   make help     - See all commands
#
# 📝 SECTIONS:
#   1. Build System    - How Python packages the project
#   2. Project Info    - Name, version, description
#   3. Dependencies    - What libraries we need
#   4. Code Quality    - Formatting and linting rules
#   5. Testing         - How tests are run
#   6. Type Checking   - Static type analysis
# ============================================================================

# ============================================================================
# 1️⃣ BUILD SYSTEM - How Python packages this project
# ============================================================================
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================================
# 2️⃣ PROJECT INFORMATION - Basic project details
# ============================================================================
[project]
name = "plantguard"
version = "0.1.0"
description = "🌿 AI-powered plant disease detection with Vision Transformer, MobileNet, and ResNet50 models"
authors = [{ name = "PlantGuard Team", email = "umit.arslan@outlook.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"

# 🏷️ Keywords for package discovery
keywords = [
  "plant-disease", "computer-vision", "machine-learning",
  "agriculture", "ai", "pytorch", "streamlit", "multimodal"
]

# 📋 Package classifiers (for PyPI)
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: OS Independent",
  "Environment :: Web Environment",
]

# ============================================================================
# 3️⃣ DEPENDENCIES - What libraries PlantGuard needs to work
# ============================================================================
# 💡 TIP: All versions are in requirements.txt - this is just the minimum needed

dependencies = [
  # 🧠 AI/ML Core - The brain of PlantGuard
  "torch>=2.1.0",           # PyTorch - main ML framework
  "torchvision>=0.16.0",    # Computer vision models
  "torchaudio>=2.1.0",      # Audio processing
  "torchmetrics>=1.2.0",    # ML metrics and evaluation

  # 📊 Data Processing - Handle numbers and data
  "numpy>=1.24.0",          # Fast arrays and math
  "pandas>=2.1.0",          # Data tables and analysis
  "scikit-learn>=1.3.0",    # Traditional ML algorithms

  # 👁️ Computer Vision - See and understand images
  "opencv-python-headless>=4.8.0",  # Image processing (no GUI)
  "Pillow>=10.0.0",                  # Image loading and basic editing

  # 🤗 Hugging Face - Pre-trained AI models
  "transformers>=4.34.0",   # Vision Transformer, BERT, etc.
  "accelerate>=0.24.0",     # Fast model loading
  "datasets>=2.14.0",       # Dataset handling

  # 🎵 Audio Processing - Hear and understand speech
  "librosa>=0.10.1",        # Audio analysis
  "soundfile>=0.12.1",      # Audio file reading/writing
  "SpeechRecognition>=3.10.0",  # Speech-to-text

  # 🌐 Web Interface - The app you see in your browser
  "streamlit>=1.27.0",      # Main web framework
  "streamlit-webrtc>=0.47.0",  # Real-time audio/video
  "pycloudflared>=0.2.0",   # HTTPS tunnels for microphone
  "pyngrok>=7.0.0",         # Alternative tunneling

  # 🛠️ Utilities - Helper tools
  "python-dotenv>=1.0.0",   # Environment variables (.env files)
  "tensorboard>=2.14.0",    # Training visualization
]

# ============================================================================
# 📦 OPTIONAL DEPENDENCIES - Extra features you can install
# ============================================================================
# 💡 USAGE:
#   pip install plantguard[dev]      - Development tools
#   pip install plantguard[jupyter]  - Notebook support
#   pip install plantguard[all]      - Everything
#
# 🚀 QUICK INSTALL: make setup (installs everything automatically)

[project.optional-dependencies]

# 🛠️ Development Tools - For coding and maintaining PlantGuard
dev = [
  "ruff>=0.1.0",           # ⚡ Super fast Python linter & formatter
  "mypy>=1.6.0",           # 🔍 Type checking (catches bugs early)
  "pytest>=7.4.0",        # 🧪 Testing framework
  "pytest-cov>=4.1.0",    # 📊 Test coverage reports
  "pytest-mock>=3.12.0",  # 🎭 Mock objects for testing
  "bandit>=1.7.5",        # 🔒 Security vulnerability scanner
  "safety>=3.0.0",        # 🛡️ Check for known security issues
  "pre-commit>=3.0.0",    # 🪝 Git hooks for code quality
]

# 📚 Documentation Tools - Generate beautiful docs
docs = [
  "sphinx>=7.0.0",         # 📖 Documentation generator
  "sphinx-rtd-theme>=2.0.0",  # 🎨 Read the Docs theme
  "myst-parser>=2.0.0",    # 📝 Markdown support in Sphinx
]

# 📓 Jupyter & Analysis - Interactive development
jupyter = [
  "jupyter>=1.0.0",        # 📓 Jupyter notebooks
  "ipykernel>=6.25.0",     # 🐍 Python kernel for notebooks
  "matplotlib>=3.7.0",     # 📈 Plotting and visualization
  "seaborn>=0.12.0",       # 🎨 Beautiful statistical plots
  "plotly>=5.0.0",         # 📊 Interactive plots
]

# 🤖 ML Training & Experiments - Advanced ML features
training = [
  "wandb>=0.15.0",         # 📊 Experiment tracking (Weights & Biases)
  "optuna>=3.3.0",        # 🎯 Hyperparameter optimization
  "tensorboard>=2.14.0",   # 📈 Training visualization (already in main deps)
]

# 🎯 Quick Install Options
all = ["plantguard[dev,docs,jupyter,training]"]  # Everything
basic = ["plantguard[jupyter]"]                  # Just notebooks
full-dev = ["plantguard[dev,docs,jupyter]"]      # Development without ML extras

# 🔗 Project Links - Where to find more info
[project.urls]
"🏠 Homepage" = "https://github.com/arslanmit/PlantGuard"
"📂 Source Code" = "https://github.com/arslanmit/PlantGuard"
"🐛 Bug Reports" = "https://github.com/arslanmit/PlantGuard/issues"
"📖 Documentation" = "https://github.com/arslanmit/PlantGuard/wiki"
"📋 Changelog" = "https://github.com/arslanmit/PlantGuard/releases"
"🚀 Try in Colab" = "https://colab.research.google.com/github/arslanmit/PlantGuard/blob/main/notebooks/PlantGuard.ipynb"

# 🖥️ Command Line Tools - Run PlantGuard from terminal
[project.scripts]
plantguard = "src.plantguard_bot:main"           # Main CLI interface
plantguard-train = "src.training.production_trainer:main"  # Training CLI

# ============================================================================
# 4️⃣ CODE QUALITY - Keep code clean and consistent
# ============================================================================
# 🎯 GOAL: Make code readable, consistent, and bug-free
#
# 🚀 QUICK COMMANDS:
#   make format  - Auto-fix formatting
#   make lint    - Check for issues
#   make fix     - Auto-fix what we can
#   make dev     - Do both format + lint

# ⚡ RUFF - Super fast Python linter and formatter (replaces Black, isort, flake8)
[tool.ruff]
line-length = 100              # 📏 Max characters per line (ADHD-friendly: not too long)
target-version = "py311"       # 🐍 Python version we support
fix = true                     # 🔧 Auto-fix issues when possible
show-fixes = true              # 📝 Show what was fixed
output-format = "grouped"      # 📊 Group similar issues together

# 🔍 What Ruff checks for (the rules we follow)
# 💡 TIP: Add # before any rule to deactivate it, remove # to activate
[tool.ruff.lint]
select = [
  # ============================================================================
  # 🐍 CORE PYTHON RULES - The absolute basics everyone should follow
  # ============================================================================
  "E",   # pycodestyle errors (spacing, indentation, line length)
  "F",   # pyflakes (unused imports, undefined variables, syntax errors)
  "I",   # isort (organize imports nicely by category)

  # ============================================================================
  # 🐛 BUG PREVENTION - Catch common Python mistakes and gotchas
  # ============================================================================
  "B",   # flake8-bugbear (common Python gotchas and anti-patterns)
  "A",   # flake8-builtins (don't shadow built-ins like 'list', 'dict')
  "C4",  # flake8-comprehensions (better list/dict comprehensions)
  "PIE", # flake8-pie (miscellaneous improvements and simplifications)
  "SIM", # flake8-simplify (simpler, more readable code patterns)
  "UP",  # pyupgrade (modern Python syntax, f-strings, type hints)

  # ============================================================================
  # 📝 DOCUMENTATION & TYPE SAFETY - Make code self-documenting
  # ============================================================================
  "ANN", # flake8-annotations (type hints for functions and variables)
  "D",   # pydocstyle (docstring style and completeness)

  # ============================================================================
  # 🔒 SECURITY & ERROR HANDLING - Keep code safe and robust
  # ============================================================================
  "S",   # flake8-bandit (security vulnerabilities and unsafe patterns)
  "BLE", # flake8-blind-except (catch specific exceptions, not bare except)
  "TRY", # tryceratops (better exception handling patterns)

  # ============================================================================
  # 🧠 CODE COMPLEXITY - Keep it simple and maintainable (ADHD-friendly!)
  # ============================================================================
  "C90", # mccabe (cyclomatic complexity - how many paths through functions)
  "PLR", # pylint refactor (code structure, complexity, design issues)
  "PLW", # pylint warnings (potential bugs, unused variables, etc.)
  "PLE", # pylint errors (definite bugs and errors)

  # ============================================================================
  # 🚀 MODERN PYTHON - Use the latest best practices and features
  # ============================================================================
  "PTH", # flake8-use-pathlib (use pathlib.Path instead of os.path)
  "RUF", # ruff-specific rules (unique to Ruff linter)

  # ============================================================================
  # ⚡ PERFORMANCE - Make code faster and more efficient
  # ============================================================================
  "PERF", # perflint (performance improvements and optimizations)

  # ============================================================================
  # 📦 IMPORT & CODE ORGANIZATION - Clean, organized, readable code
  # ============================================================================
  "TID", # flake8-tidy-imports (import organization and banned imports)

  # ============================================================================
  # 🖨️ LOGGING & OUTPUT - Proper logging instead of print statements
  # ============================================================================
  "G",   # flake8-logging-format (proper logging format and usage)
  "T20", # flake8-print (discourage print(), encourage logging)

  # ============================================================================
  # 🔧 ADDITIONAL RULE CATEGORIES - Expand as needed
  # ============================================================================
  # 💡 Add more rule categories here as they become available
  # Check https://docs.astral.sh/ruff/rules/ for the latest rules

  # 🎯 ASYNC & CONCURRENCY - Async/await patterns
  # "ASYNC", # flake8-async (async/await best practices) - Future rule category

  # 🔄 REFACTORING - Code improvement suggestions
  # "FURB", # refurb (modernize and improve Python code) - Available in newer Ruff versions

  # 🧪 TESTING - Test code quality
  # "PT",  # flake8-pytest-style (pytest best practices)

  # 📊 DATA SCIENCE - NumPy, Pandas, etc.
  # "NPY", # numpy-specific rules - Future rule category
  # "PD",  # pandas-vet (pandas best practices) - Available in some Ruff versions

  # 🌐 WEB DEVELOPMENT - Django, Flask, etc.
  # "DJ",  # flake8-django (Django best practices) - Available in some Ruff versions

  # 🔐 CRYPTOGRAPHY - Secure crypto usage
  # "CRYPT", # cryptography best practices - Future rule category

  # 📝 DOCUMENTATION GENERATION - Sphinx, etc.
  # "DOC", # documentation generation rules - Future rule category

  # 🎨 CODE STYLE - Additional style rules
  # "COM", # flake8-commas (trailing commas) - Available in some Ruff versions
  # "Q",   # flake8-quotes (quote style consistency) - Available in some Ruff versions

  # 🔍 CODE ANALYSIS - Advanced analysis
  # "ERA", # eradicate (commented-out code) - Available in some Ruff versions
  # "FBT", # flake8-boolean-trap (boolean trap anti-pattern) - Available in some Ruff versions

  # 🏗️ ARCHITECTURE - Code architecture patterns
  # "ARG", # flake8-unused-arguments (unused function arguments) - Available in some Ruff versions
  # "PTH", # Already included above - pathlib usage

  # 🔄 COMPATIBILITY - Python version compatibility
  # "YTT", # flake8-2020 (Python 2/3 compatibility) - Available in some Ruff versions

  # ============================================================================
  # 📋 RULE ACTIVATION EXAMPLES - How to control individual rules
  # ============================================================================
  #
  # 🎯 TO ACTIVATE A SPECIFIC RULE CATEGORY:
  # Just add it to the list above, like: "PT",  # pytest rules
  #
  # 🎯 TO ACTIVATE ONLY SPECIFIC RULES FROM A CATEGORY:
  # Instead of "B", use specific codes like:
  # "B001", "B002", "B007",  # only these bugbear rules
  #
  # 🎯 TO DEACTIVATE A RULE CATEGORY:
  # Add # before it: # "D",  # disable all docstring rules
  #
  # 🎯 EXAMPLES OF GRANULAR CONTROL:
  # "E501",    # line too long (if you want only this E rule)
  # "F401",    # unused import (if you want only this F rule)
  # "B007",    # unused loop variable (if you want only this B rule)
  # "ANN001",  # missing type annotation (if you want only this ANN rule)
  #
  # 🎯 MIX AND MATCH:
  # You can combine categories and specific rules:
  # "E",       # all pycodestyle errors
  # "F401",    # but only this specific pyflakes rule
  # "B007",    # and only this specific bugbear rule
]

