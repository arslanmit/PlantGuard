  # "Q000",   # single quotes found but double quotes preferred
  # "Q001",   # single quote multiline found but double quotes preferred
  # "Q002",   # single quote docstring found but double quotes preferred
  # "Q003",   # change outer quotes to avoid escaping inner quotes

  # 🔍 ERADICATE (ERA) - Commented-out code (uncomment to enable)
  "ERA001", # Allow commented-out code - ML experiments often keep alternative implementations for comparison

  # 🔘 FLAKE8-BOOLEAN-TRAP (FBT) - Boolean trap anti-pattern (uncomment individual rules to enable)
  "FBT001", # Allow boolean positional args - ML functions commonly use training=True, eval=False patterns
  "FBT002", # Allow boolean default values - ML model constructors often have boolean configuration flags
  "FBT003", # Allow boolean positional values - ML training calls frequently use boolean mode switches

  # 🔧 FLAKE8-UNUSED-ARGUMENTS (ARG) - Unused function arguments (uncomment individual rules to enable)
  "ARG001", # Allow unused function arguments - ML interfaces often have compatibility parameters
  "ARG002", # Allow unused method arguments - ML model methods may not use all inherited parameters
  "ARG003", # Allow unused class method arguments - ML factory methods often have unused config parameters
  "ARG004", # Allow unused static method arguments - ML utility functions may have interface compatibility args
  "ARG005", # Allow unused lambda arguments - ML data processing lambdas often ignore some parameters

  # 🔄 FLAKE8-2020 (YTT) - Python 2/3 compatibility (uncomment individual rules to enable)
  # "YTT101", # sys.version[:3] referenced (python3.10+), use sys.version_info
  # "YTT102", # sys.version[2] referenced (python3.10+), use sys.version_info
  # "YTT103", # sys.version compared to string (python3.10+), use sys.version_info
  # "YTT201", # sys.version_info[0] == 3 referenced (python3.10+), use sys.version_info
  # "YTT202", # six.PY3 referenced (python3.10+), use sys.version_info
  # "YTT203", # sys.version_info[1] referenced (python3.10+), use sys.version_info
  # "YTT204", # sys.version_info.minor referenced (python3.10+), use sys.version_info
  # "YTT301", # sys.version[0] referenced (python3.10+), use sys.version_info
  # "YTT302", # sys.version compared to string (python3.10+), use sys.version_info
  # "YTT303", # sys.version[:1] referenced (python3.10+), use sys.version_info

  # 🌐 FLAKE8-DJANGO (DJ) - Django best practices (uncomment individual rules to enable)
  # "DJ001",  # avoid using null=True on string-based fields
  # "DJ003",  # avoid using null=True on string-based fields
  # "DJ006",  # avoid using exclude with ModelForm, use fields instead
  # "DJ007",  # avoid using __all__ with ModelForm, use fields instead
  # "DJ008",  # model's __str__ method should return a string
  # "DJ012",  # avoid using null=True on string-based fields
  # "DJ013",  # avoid using null=True on string-based fields

  # 📊 PANDAS-VET (PD) - Pandas best practices (uncomment individual rules to enable)
  "PD002",  # Allow inplace=True - ML data preprocessing often uses inplace operations for memory efficiency
  # "PD003",  # .isna is preferred to .isnull; functionality is equivalent
  # "PD004",  # .notna is preferred to .notnull; functionality is equivalent
  # "PD007",  # .ix is deprecated; use more explicit .loc or .iloc
  # "PD008",  # use .loc instead of .at. If speed is important, use numpy
  # "PD009",  # use .iloc instead of .iat. If speed is important, use numpy
  # "PD010",  # .pivot_table is preferred to .pivot or .unstack; provides same functionality
  "PD011",  # Allow .values instead of .to_numpy() - legacy ML code often uses .values for compatibility
  # "PD012",  # .read_csv is preferred to .read_table; provides same functionality
  # "PD013",  # .melt is preferred to .stack; provides same functionality
  # "PD015",  # use .merge method instead of pd.merge function. They have equivalent functionality
  "PD901",  # Allow 'df' variable name - very common and clear in ML data processing contexts

  # 🔄 REFURB (FURB) - Code modernization (uncomment individual rules to enable)
  "FURB101", # Allow open() and read() - ML model loading often needs traditional file handling for compatibility
  "FURB103", # Allow open() and write() - ML checkpoint saving often uses traditional file operations
  "FURB105", # Allow print() and open() - ML logging and file operations often combined
  # "FURB110", # if-exp-else-none should be replaced by and
  "FURB113", # Allow repeated append() - ML data building often clearer with explicit append operations
  # "FURB116", # f-string-number-format should be replaced by format specifier
  # "FURB118", # operator.methodcaller should be replaced by lambda
  # "FURB129", # read-whole-file should be replaced by pathlib
  # "FURB131", # delete-full-slice should be replaced by clear
  # "FURB132", # check-and-remove-from-set should be replaced by discard
  # "FURB136", # if-expr-min-max should be replaced by min/max
  # "FURB140", # reimplemented-starmap should be replaced by itertools.starmap
  "FURB142", # Allow for-loop set mutations - ML data processing often clearer with explicit loops
  # "FURB145", # slice-copy should be replaced by copy
  "FURB148", # Allow enumerate() over zip() - ML batch processing often needs explicit indexing
  # "FURB152", # math-constant should be replaced by constant
  # "FURB154", # repeated-global should be replaced by global
  # "FURB157", # verbose-decimal-constructor should be replaced by literal
  # "FURB161", # bit-count should be replaced by int.bit_count
  # "FURB163", # redundant-log-base should be replaced by math.log
  # "FURB164", # unnecessary-from-float should be replaced by literal
  # "FURB166", # int-on-sliced-str should be replaced by str methods
  # "FURB167", # regex-flag-alias should be replaced by flag
  # "FURB168", # isinstance-type-none should be replaced by is-none check
  # "FURB169", # type-none-comparison should be replaced by is-none check
  # "FURB171", # single-item-membership-test should be replaced by comparison
  # "FURB177", # implicit-cwd should be replaced by pathlib
  # "FURB180", # meta-class-abc should be replaced by abc.ABC
  # "FURB181", # hashlib-digest-hex should be replaced by hexdigest
  # "FURB187", # list-reverse-copy should be replaced by slicing

]

# 📦 Import Organization - Keep imports clean and organized
[tool.ruff.lint.isort]
# 🏠 Our code (PlantGuard modules)
known-first-party = ["plantguard", "src"]

# 🌐 External libraries we use (organized by category for ADHD-friendly reading)
known-third-party = [
  # 🧠 AI/ML Core
  "torch", "torchvision", "torchaudio", "torchmetrics",

  # 📊 Data Science
  "numpy", "pandas", "sklearn",

  # 👁️ Computer Vision
  "cv2", "PIL",

  # 🤗 Hugging Face
  "transformers", "datasets", "accelerate",

  # 🎵 Audio
  "librosa", "soundfile", "speech_recognition",

  # 🌐 Web Interface
  "streamlit", "streamlit_webrtc",

  # 📈 Visualization
  "matplotlib", "seaborn", "plotly",

  # 🧪 Testing & ML Tools
  "pytest", "wandb", "optuna",
]

# 📋 Import order (top to bottom in files)
section-order = [
  "future",          # from __future__ import ...
  "standard-library", # Built-in Python modules (os, sys, etc.)
  "third-party",     # External packages (torch, numpy, etc.)
  "first-party",     # Our PlantGuard code
  "local-folder",    # Relative imports (from . import ...)
]

split-on-trailing-comma = true  # Split long import lists nicely
force-single-line = false       # Allow multiple imports per line when short

# 📝 Documentation Style - How we write docstrings
[tool.ruff.lint.pydocstyle]
convention = "google"  # Use Google-style docstrings (clear and readable)

# 🧠 Complexity Limits - Keep functions simple (ADHD-friendly!)
[tool.ruff.lint.mccabe]
max-complexity = 20    # Max cyclomatic complexity (how many paths through a function)

[tool.ruff.lint.pylint]
max-args = 10          # Max function arguments (ML functions need more params)
max-branches = 20     # Max if/elif branches
max-returns = 10       # Max return statements
max-statements = 50   # Max lines in a function

# 📝 Quote Style - Consistent string quotes
[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"      # Use "double quotes" for strings
multiline-quotes = "double"   # Use """double quotes""" for multi-line
docstring-quotes = "double"   # Use """double quotes""" for docstrings
avoid-escape = true           # Avoid escaping quotes when possible

# 🏷️ Type Annotations - Gradual typing approach
[tool.ruff.lint.flake8-annotations]
mypy-init-return = true       # __init__ methods should return None
suppress-dummy-args = true    # Don't require types for *args, **kwargs
allow-star-arg-any = false    # Require specific types for *args
ignore-fully-untyped = false # Check all functions, even without types

# 🔒 Security Settings
[tool.ruff.lint.flake8-bandit]
check-typed-exception = true  # Check exception handling

# 📁 Per-file ignores - Different rules for different file types
[tool.ruff.lint.per-file-ignores]
# 🧪 Test files - Allow assert statements and missing docstrings
"tests/**/*.py" = [
  "S101",   # Allow assert statements in tests
  "D103",   # Allow missing docstrings in test functions
  "D102",   # Allow missing docstrings in test methods
  "D107",   # Allow missing docstrings in test __init__
  "T201",   # Allow print statements in tests for debugging
]

# 📓 Scripts and notebooks - Allow subprocess calls and missing docstrings
"scripts/**/*.py" = [
  "S603",   # Allow subprocess calls in scripts
  "S607",   # Allow partial executable paths in scripts
  "D103",   # Allow missing docstrings in script functions
  "S101",   # Allow assert statements in scripts
  "T201",   # Allow print statements in scripts for output
]

# 📓 Jupyter notebooks - Allow subprocess calls and other notebook-specific patterns
"notebooks/**/*.ipynb" = [
  "S603",   # Allow subprocess calls in notebooks
  "S607",   # Allow partial executable paths in notebooks
  "T201",   # Allow print statements in notebooks for interactive output
]

# 🏃 Run scripts - Allow subprocess calls
"run_*.py" = [
  "S603",   # Allow subprocess calls in run scripts
  "T201",   # Allow print statements in run scripts for output
]

# 📦 Package init files - Allow missing docstrings
"src/**/__init__.py" = [
  "D104",   # Allow missing docstrings in package __init__.py
]

# 🎨 Code Formatting - How code looks
[tool.ruff.format]
quote-style = "double"    # Use "double quotes"
indent-style = "space"    # Use spaces, not tabs
line-ending = "auto"      # Auto-detect line endings (Windows/Mac/Linux)

# 📦 Setuptools - Python packaging tool
[tool.setuptools]
package-dir = { "" = "src" }          # Source code is in src/ folder

[tool.setuptools.packages.find]
where = ["src"]                       # Look for packages in src/
include = ["plantguard*"]             # Include all plantguard packages
exclude = ["tests*"]                  # Don't include test packages

[tool.setuptools.package-data]
plantguard = [
  "py.typed",                         # Type information file
  "*.json",                           # Configuration files
  "*.yaml", "*.yml",                  # YAML configuration files
]

# ============================================================================
# 🎉 END OF CONFIGURATION
# ============================================================================
#
# 🚀 QUICK START REMINDER:
#   make setup   - Install everything
#   make run     - Launch PlantGuard
#   make dev     - Development workflow
#   make help    - See all available commands
#
# 📚 LEARN MORE:
#   - README.md - Full documentation
#   - Makefile - All available commands
#   - requirements.txt - Exact dependency versions
#
# 🐛 HAVING ISSUES?
#   make status  - Check project health
#   make clean   - Clean up temporary files
#   make fresh   - Fresh installation
# ============================================================================
# ============================================================================
# 🔧 PYLINT CONFIGURATION - Traditional pylint settings
# ============================================================================
# Additional pylint configuration for compatibility with direct pylint runs

[tool.pylint.messages_control]
disable = [
    "W1203",  # logging-fstring-interpolation - Allow f-strings in logging for ML readability
    "W0718",  # broad-exception-caught - Allow broad exception handling in ML model operations
    "W0612",  # unused-variable - Allow unused variables in ML experiments and debugging
    "W0201",  # attribute-defined-outside-init - Allow dynamic attributes in ML classes
    "W0611",  # unused-import - Allow unused imports in ML experimental code
    "W0104",  # pointless-statement - Allow statements that seem to have no effect in ML code
    "W0212",  # protected-access - Allow access to protected members in ML frameworks
    "C0413",  # wrong-import-position - Allow conditional imports in ML code
    "C0301",  # line-too-long - Allow longer lines for ML parameter lists
    "C0302",  # too-many-lines - Allow large ML training modules
    "C0415",  # import-outside-toplevel - Allow conditional imports for ML dependencies
    "C0303",  # trailing-whitespace - Allow trailing whitespace in ML code
    "C0103",  # invalid-name - Allow ML naming conventions like T_max for schedulers
    "E0401",  # import-error - Allow import errors for optional ML dependencies
]

[tool.pylint.format]
max-line-length = 200  # Match ruff line length setting

[tool.pylint.design]
max-args = 10          # Allow more arguments for ML model constructors
max-branches = 20      # Allow complex branching in ML pipelines
max-statements = 60    # Allow longer functions for ML model definitions
