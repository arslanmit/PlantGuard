[theme]
base = "light"
primaryColor = "#16A34A"
backgroundColor = "#F8FAF8"
secondaryBackgroundColor = "#F0F9F0"
textColor = "#1F2937"
font = "sans serif"

[server]
headless = true
port = 8501
maxUploadSize = 200
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[runner]
magicEnabled = true
postScriptGC = true
fastReruns = true
enforceSerializableSessionState = false

[logger]
level = "info"
